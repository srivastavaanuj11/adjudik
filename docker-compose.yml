# Adjudik development stack (SPEC §16.2). All host ports bound to 127.0.0.1.
# Python services share one dev image (Dockerfile.dev); the repo is bind-mounted
# and `uv sync` runs on start so edits are live.

x-python-build: &python-build
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: .env
  volumes:
    - .:/app
    - py-venv:/opt/venv
  working_dir: /app/server
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adjudik}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-adjudik}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-pw}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-pw}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    <<: *python-build
    command: >
      sh -c "uv sync --locked &&
             DATABASE_URL=\"$$DATABASE_OWNER_URL\" uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"

  worker-model:
    <<: *python-build
    command: sh -c "uv sync --locked && uv run celery -A adjudik_server worker -Q model -P threads -c 16 -l info"

  worker-webhooks:
    <<: *python-build
    command: sh -c "uv sync --locked && uv run celery -A adjudik_server worker -Q webhooks -P threads -c 8 -l info"

  worker-jobs:
    <<: *python-build
    command: sh -c "uv sync --locked && uv run celery -A adjudik_server worker -Q jobs,default -c 2 --max-tasks-per-child 20 -l info"

  beat:
    <<: *python-build
    command: sh -c "uv sync --locked && uv run celery -A adjudik_server beat -l info"

  web:
    image: node:22
    working_dir: /app/web
    env_file: .env
    environment:
      VITE_API_TARGET: http://server:8000
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
  py-venv:
  web-node-modules:
